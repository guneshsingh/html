<!DOCTYPE html>
<html>
<head>
    <title>CSS Specificity</title>

    <style>
        h1 {
            color: red;
        }

        #title {
            color: blue;
        }

        .important {
            color: green;
        }
    </style>
</head>

<body>

    <h1>First Heading</h1>

    <h1 class="important">Important Heading</h1>

    <h1 id="title" style="color: purple;">Title Heading</h1>

</body>
</html>
