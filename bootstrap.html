<!DOCTYPE html>
<html>
<head>
  <title>Red Strip Example</title>
  <style>
    .red-strip {
      background-color: red;   /* solid red strip */
      color: white;            /* text color */
      text-align: center;      /* center the text */
      padding: 15px;           /* height of the strip */
      font-size: 24px;         /* text size */
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="red-strip"> Display Classes</div>
</body>
</html>
