<!DOCTYPE html>
<html>
<head>
    <title>Colspan and Rowspan</title>
</head>
<body>

    <table border="1">
        
        <tr>
            <th colspan="2">Personal Information</th>
            <th colspan="2">Contact Information</th>
        </tr>

        <tr>
            <td rowspan="2">Rahul</td>
            <td>20</td>
            <td>Delhi</td>
            <td>9876543210</td>
        </tr>

        <tr>
            <td colspan="2">Mumbai</td>
            <td>9123456780</td>
        </tr>

    </table>

</body>
</html>
