<!DOCTYPE html>
<html>
<head>
    <title>HTML Links</title>
</head>
<body>
    <h1>Different Types of Links</h1>
    <h2>External Link</h2>
    <p>
        Visit 
        <a href="https://www.google.com" target="_blank">
            Google
        </a>
    </p>
    <h2>Internal Link</h2>
    <p>
        <a href="#about">Go to About Section</a>
    </p>

    <br><br><br><br><br><br>
    <section id="about">
        <h2>About Section</h2>
        <p>
            This is the About section of the same page.
        </p>
</section>
    <h2>Email Link</h2>
    <p>
        <a href="mailto:example@gmail.com">
            Send us an Email
        </a>
    </p>
    <h2>Image as a Hyperlink</h2>

    <a href="https://www.wikipedia.org" target="_blank">
        <img 
            src="images.jpg"
            alt="Click to visit Wikipedia"
            width="200"
        >
    </a>
</body>
</html>
